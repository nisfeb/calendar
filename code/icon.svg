<!-- the calendar logo: a page of days, the big dot today.
     docs/logo.svg is the mark alone.
     Drawn the way Talon's icon is (talon scripts/make-icons.py, 2026-10-01):
     the mark centred by its drawn bounds, its longer side 62% of the
     canvas, on a rounded square of Talon's navy (#1E1B4B; 920 px with a
     52 px margin, radius 200), in the family amber (#f9a804). The
     launcher tile rounds itself and its colour is the same navy, so
     there the margin is the tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="52" y="52" width="920" height="920" rx="200" fill="#1E1B4B"/>
  <g transform="translate(13.44 44.60) scale(1.9475)">
  <g fill="none" stroke="#f9a804" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="104" y="128" width="304" height="264" rx="30"/>
    <line x1="104" y1="212" x2="408" y2="212"/>
    <line x1="178" y1="88" x2="178" y2="166"/>
    <line x1="334" y1="88" x2="334" y2="166"/>
  </g>
  <g fill="#f9a804">
    <circle cx="180" cy="270" r="19"/><circle cx="256" cy="270" r="19"/><circle cx="332" cy="270" r="19"/>
    <circle cx="180" cy="340" r="19"/><circle cx="256" cy="340" r="30"/><circle cx="332" cy="340" r="19"/>
  </g>
  </g>
</svg>
