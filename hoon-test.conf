# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md.

DESK=calendar-test

# a grubbery desk: its /< and /& imports are translated for clay on the way,
# and each lib lands at its path under CODE
DIALECT=grubbery
CODE=code

# the libs under test and everything they import (pytz's zone files come
# with it, one /* each)
LIBS="code/lib/pytz.hoon code/lib/rules.hoon code/lib/rrule.hoon code/lib/calendar.hoon code/lib/ics.hoon code/lib/dav.hoon code/lib/gcal.hoon code/lib/rules/once.hoon code/lib/rules/every.hoon code/lib/rules/rrule.hoon code/lib/calendar-core.hoon"

# grubbery puts these in every lib's subject: calendar uses tarball's rail,
# json-utils' jo, and html-utils' kv (shims or copies in tests/shim)
PRELUDE="tarball json-utils html-utils"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

FILES="tests/shim/tarball.hoon=lib/tarball.hoon tests/shim/json-utils.hoon=lib/json-utils.hoon tests/shim/html-utils.hoon=lib/html-utils.hoon"

# json builds through mime; the zone files are txt, which diffs as txt-diff
MARKS="json mime txt txt-diff"
